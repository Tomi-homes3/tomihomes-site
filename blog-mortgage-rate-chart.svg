<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Freddie Mac 30-year fixed mortgage rate: 6.26 percent in September 2025, 6.76 percent on September 10 2026, and 6.95 percent on September 17 2026.">
  <defs>
    <style>
      .ff { font-family: "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .fb { font-family: Georgia, "Times New Roman", serif; }
    </style>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#acc66d"/><stop offset="100%" stop-color="#859f3c"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fecc57"/><stop offset="100%" stop-color="#e8b840"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#df6033"/><stop offset="100%" stop-color="#c4552c"/></linearGradient>
  </defs>

  <rect width="1200" height="660" fill="#024757"/>
  <rect x="0" y="0" width="1200" height="6" fill="#b8935a"/>

  <text class="ff" x="70" y="78" font-size="19" letter-spacing="3.5" fill="#d9bd8c">FREDDIE MAC &#183; PRIMARY MORTGAGE MARKET SURVEY</text>
  <text class="fb" x="70" y="132" font-size="40" font-style="italic" fill="#ffffff">Rates moved. Prices barely did.</text>
  <text class="fb" x="70" y="168" font-size="20" fill="rgba(255,255,255,0.6)">Average 30-year fixed rate, U.S.</text>

  <line x1="70" y1="565" x2="1130" y2="565" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

  <!-- 6.26 -->
  <rect x="150" y="415" width="190" height="150" fill="url(#g1)"/>
  <text class="ff" x="245" y="392" font-size="54" fill="#acc66d" text-anchor="middle">6.26%</text>
  <text class="ff" x="245" y="605" font-size="18" letter-spacing="2.5" fill="#ffffff" text-anchor="middle">SEPT 2025</text>
  <text class="fb" x="245" y="633" font-size="17" fill="rgba(255,255,255,0.5)" text-anchor="middle">One year ago</text>

  <!-- 6.76 -->
  <rect x="505" y="315" width="190" height="250" fill="url(#g2)"/>
  <text class="ff" x="600" y="292" font-size="54" fill="#fecc57" text-anchor="middle">6.76%</text>
  <text class="ff" x="600" y="605" font-size="18" letter-spacing="2.5" fill="#ffffff" text-anchor="middle">SEPT 10, 2026</text>
  <text class="fb" x="600" y="633" font-size="17" fill="rgba(255,255,255,0.5)" text-anchor="middle">Last week</text>

  <!-- 6.95 -->
  <rect x="860" y="277" width="190" height="288" fill="url(#g3)"/>
  <text class="ff" x="955" y="254" font-size="54" fill="#df6033" text-anchor="middle">6.95%</text>
  <text class="ff" x="955" y="605" font-size="18" letter-spacing="2.5" fill="#ffffff" text-anchor="middle">SEPT 17, 2026</text>
  <text class="fb" x="955" y="633" font-size="17" fill="rgba(255,255,255,0.5)" text-anchor="middle">This week</text>

  <text class="fb" x="1130" y="168" font-size="19" font-style="italic" fill="#d9bd8c" text-anchor="end">+0.69 points in twelve months</text>
</svg>
